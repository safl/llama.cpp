doc: |
  Abridged variant of bench_cold_start_multi_instance.yaml.

  Uses one model (Meta-Llama-3.1-8B-Instruct-Q8_0) cloned onto all
  four DMA drives instead of four distinct models. Saves the three
  extra ~8-10 GB HuggingFace fetches. Same four-drive-parallel
  comparison across loaders otherwise.

  force_format on the source drive is FALSE here so a re-run does
  not wipe already-downloaded models on /mnt/gguf-src. First-time
  users should run mount_source_drive with force_format=true (via
  bench_cold_start_multi_instance.yaml) once, then switch to this
  workflow for iteration.

steps:
- name: kill_stray_cuda
  uses: kill_stray_cuda

- name: enable_mps
  uses: enable_mps

- name: driver_reset
  uses: xnvme_driver_reset

- name: sync
  uses: git_sync
  with:
    upstream: https://github.com/ggml-org/llama.cpp.git
    branch: bench-cold-start
    base_branch: master
    remote_alias: target
    local_path: /home/odus/git/llama.cpp
    remote_path: /root/llama.cpp

- name: install_xnvme
  uses: install_xnvme
  with:
    xnvme_src: /root/xnvme
    xnvme_branch: main

- name: build
  uses: remote_build
  with:
    llama_src: /root/llama.cpp
    llama_build: /root/llama.cpp/build
    cuda_arch: "86"

- name: mount_source_drive
  uses: setup_dataset
  with:
    pci_addr: "0000:01:00.0"
    namespace: 1
    mount_point: /mnt/gguf-src
    gguf_src: ""
    force_format: false

- name: fetch_llama
  uses: fetch_model
  with:
    gguf_src: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    gguf_url: https://huggingface.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF/resolve/main/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf?download=true

# Clone the same model onto each of the four 990 PROs. Each drive
# gets its own XFS + one copy + its own FIEMAP capture, so extents
# JSONs still differ per drive (different physical block placement).
- name: prepare_dma_c1
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:c1:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-0
    fs_dst_name: model.gguf
    source_gguf: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    gguf_extents_path: /root/dma-c1.extents.json

- name: prepare_dma_c2
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:c2:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-1
    fs_dst_name: model.gguf
    source_gguf: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    gguf_extents_path: /root/dma-c2.extents.json

- name: prepare_dma_c3
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:c3:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-2
    fs_dst_name: model.gguf
    source_gguf: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    gguf_extents_path: /root/dma-c3.extents.json

- name: prepare_dma_c4
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:c4:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-3
    fs_dst_name: model.gguf
    source_gguf: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    gguf_extents_path: /root/dma-c4.extents.json

- name: run_parallel_mmap
  uses: run_parallel_instances
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    loader: mmap
    model_paths: "/mnt/dma-0/model.gguf,/mnt/dma-1/model.gguf,/mnt/dma-2/model.gguf,/mnt/dma-3/model.gguf"
    context_size: 512
    log_dir: /tmp/single-model-mmap

- name: run_parallel_stream
  uses: run_parallel_instances
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    loader: stream
    model_paths: "/mnt/dma-0/model.gguf,/mnt/dma-1/model.gguf,/mnt/dma-2/model.gguf,/mnt/dma-3/model.gguf"
    context_size: 512
    log_dir: /tmp/single-model-stream

- name: run_parallel_xnvme_file
  uses: run_parallel_instances
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    loader: xnvme
    xnvme_be: io_uring_file
    direct_io: "true"
    cpus: "0,1,2,3"
    model_paths: "/mnt/dma-0/model.gguf,/mnt/dma-1/model.gguf,/mnt/dma-2/model.gguf,/mnt/dma-3/model.gguf"
    context_size: 512
    log_dir: /tmp/single-model-xnvme-file

- name: detach_dma_c1
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:c1:00.0"
    fs_mount_point: /mnt/dma-0

- name: detach_dma_c2
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:c2:00.0"
    fs_mount_point: /mnt/dma-1

- name: detach_dma_c3
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:c3:00.0"
    fs_mount_point: /mnt/dma-2

- name: detach_dma_c4
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:c4:00.0"
    fs_mount_point: /mnt/dma-3

- name: run_parallel_upcie
  uses: run_parallel_instances
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    loader: xnvme
    xnvme_be: upcie-cuda
    cpus: "0,1,2,3"
    model_paths: "/mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf,/mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf,/mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf,/mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf"
    dma_uris: "0000:c1:00.0,0000:c2:00.0,0000:c3:00.0,0000:c4:00.0"
    dma_extents: "/root/dma-c1.extents.json,/root/dma-c2.extents.json,/root/dma-c3.extents.json,/root/dma-c4.extents.json"
    context_size: 512
    log_dir: /tmp/single-model-upcie

# One llama.cpp process, four DMA drives. Loader rotates its submit
# loop across four xnvme_queues (xnvmeperf.c-style). Compare against
# run_parallel_upcie: same drives, same model, four concurrent
# processes vs one process with four queues.
- name: run_single_process_multi_uri
  uses: run_baseline
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    gguf_path: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    iterations: 1
    loader: xnvme
    xnvme_be: upcie-cuda
    xnvme_cpu: "0"
    xnvme_dma_uris: "0000:c1:00.0,0000:c2:00.0,0000:c3:00.0,0000:c4:00.0"
    xnvme_dma_extents: "/root/dma-c1.extents.json,/root/dma-c2.extents.json,/root/dma-c3.extents.json,/root/dma-c4.extents.json"
