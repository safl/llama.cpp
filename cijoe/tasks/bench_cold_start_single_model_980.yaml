doc: |
  Same benchmark as bench_cold_start_single_model.yaml but the DMA
  fleet is the four Samsung 980 PROs at 0000:82..85:00.0. These live
  under the same PCIe root complex as the RTX A6000 (0000:80), so
  P2P doesn't traverse the Zen4 Infinity Fabric between CCDs.

  Purpose: rules out cross-CCD topology as the cause of the
  1-fast-3-slow upcie pattern observed on the 990 PROs. If the same
  pattern shows up here, the bottleneck is inside our upcie loader
  path, not the topology.

steps:
- name: kill_stray_cuda
  uses: kill_stray_cuda

- name: enable_mps
  uses: enable_mps

- name: driver_reset
  uses: xnvme_driver_reset

- name: sync
  uses: git_sync
  with:
    upstream: https://github.com/ggml-org/llama.cpp.git
    branch: bench-cold-start
    base_branch: master
    remote_alias: target
    local_path: /home/odus/git/llama.cpp
    remote_path: /root/llama.cpp

- name: install_xnvme
  uses: install_xnvme
  with:
    xnvme_src: /root/xnvme
    xnvme_branch: main

- name: build
  uses: remote_build
  with:
    llama_src: /root/llama.cpp
    llama_build: /root/llama.cpp/build
    cuda_arch: "86"

- name: mount_source_drive
  uses: setup_dataset
  with:
    pci_addr: "0000:01:00.0"
    namespace: 1
    mount_point: /mnt/gguf-src
    gguf_src: ""
    force_format: false

- name: fetch_llama
  uses: fetch_model
  with:
    gguf_src: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    gguf_url: https://huggingface.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF/resolve/main/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf?download=true

- name: prepare_dma_82
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:82:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-0
    fs_dst_name: model.gguf
    source_gguf: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    gguf_extents_path: /root/dma-82.extents.json

- name: prepare_dma_83
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:83:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-1
    fs_dst_name: model.gguf
    source_gguf: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    gguf_extents_path: /root/dma-83.extents.json

- name: prepare_dma_84
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:84:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-2
    fs_dst_name: model.gguf
    source_gguf: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    gguf_extents_path: /root/dma-84.extents.json

- name: prepare_dma_85
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:85:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-3
    fs_dst_name: model.gguf
    source_gguf: /mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
    gguf_extents_path: /root/dma-85.extents.json

- name: run_parallel_mmap
  uses: run_parallel_instances
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    context_size: 512
    loader: mmap
    model_paths: "/mnt/dma-0/model.gguf,/mnt/dma-1/model.gguf,/mnt/dma-2/model.gguf,/mnt/dma-3/model.gguf"
    log_dir: /tmp/980-mmap

- name: run_parallel_stream
  uses: run_parallel_instances
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    context_size: 512
    loader: stream
    model_paths: "/mnt/dma-0/model.gguf,/mnt/dma-1/model.gguf,/mnt/dma-2/model.gguf,/mnt/dma-3/model.gguf"
    log_dir: /tmp/980-stream

- name: run_parallel_xnvme_file
  uses: run_parallel_instances
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    context_size: 512
    loader: xnvme
    xnvme_be: io_uring_file
    direct_io: "true"
    cpus: "0,1,2,3"
    model_paths: "/mnt/dma-0/model.gguf,/mnt/dma-1/model.gguf,/mnt/dma-2/model.gguf,/mnt/dma-3/model.gguf"
    log_dir: /tmp/980-xnvme-file

- name: detach_dma_82
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:82:00.0"
    fs_mount_point: /mnt/dma-0

- name: detach_dma_83
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:83:00.0"
    fs_mount_point: /mnt/dma-1

- name: detach_dma_84
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:84:00.0"
    fs_mount_point: /mnt/dma-2

- name: detach_dma_85
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:85:00.0"
    fs_mount_point: /mnt/dma-3

- name: run_parallel_upcie
  uses: run_parallel_instances
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    context_size: 512
    loader: xnvme
    xnvme_be: upcie-cuda
    cpus: "0,1,2,3"
    model_paths: "/mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf,/mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf,/mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf,/mnt/gguf-src/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf"
    dma_uris: "0000:82:00.0,0000:83:00.0,0000:84:00.0,0000:85:00.0"
    dma_extents: "/root/dma-82.extents.json,/root/dma-83.extents.json,/root/dma-84.extents.json,/root/dma-85.extents.json"
    log_dir: /tmp/980-upcie
