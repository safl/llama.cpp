doc: |
  Experiment 2: sharded model loading (4 drives, all four loaders).

  Sharded 40 GB Llama-3.3-70B Q4_K_M, one shard per drive
  (c1..c4 -> /mnt/dma-{0..3}). Each loader path reads all 40 GB
  from the 4-drive fleet:

    - mmap                        (kernel path, mmap-backed)
    - stream                      (kernel path, read()-based)
    - xnvme io_uring_file         (kernel path, O_DIRECT)
    - upcie-cuda                  (userspace P2P, per-file drive
                                   routing)

  MPS disabled for consistency with exp1.

  Note: the upcie-cuda step is preceded by an xnvmeperf-4-URI prime
  step. Without it, the 4-drive registry_init inside llama-completion
  intermittently produces a dev with lba_nbytes=0 and falls back to
  stream. Priming with xnvmeperf clears the state; root cause TBD.

steps:
- name: kill_stray_cuda
  uses: kill_stray_cuda

- name: disable_mps
  uses: disable_mps

- name: prepare_dma_c1
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:c1:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-0
    fs_dst_name: shard.gguf
    source_gguf: /mnt/gguf-src/Llama-3.3-70B-Q4_K_M-00001-of-00004.gguf
    gguf_extents_path: /root/dma-c1.extents.json

- name: prepare_dma_c2
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:c2:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-1
    fs_dst_name: shard.gguf
    source_gguf: /mnt/gguf-src/Llama-3.3-70B-Q4_K_M-00002-of-00004.gguf
    gguf_extents_path: /root/dma-c2.extents.json

- name: prepare_dma_c3
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:c3:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-2
    fs_dst_name: shard.gguf
    source_gguf: /mnt/gguf-src/Llama-3.3-70B-Q4_K_M-00003-of-00004.gguf
    gguf_extents_path: /root/dma-c3.extents.json

- name: prepare_dma_c4
  uses: setup_dma_target
  with:
    dma_pci_addr: "0000:c4:00.0"
    dma_namespace: 1
    layout: xfs-fiemap
    defer_detach: "true"
    fs_mount_point: /mnt/dma-3
    fs_dst_name: shard.gguf
    source_gguf: /mnt/gguf-src/Llama-3.3-70B-Q4_K_M-00004-of-00004.gguf
    gguf_extents_path: /root/dma-c4.extents.json

- name: setup_shard_symlinks
  uses: setup_shard_symlinks
  with:
    symlink_dir: /mnt/gguf-shards
    basename: Llama-3.3-70B-Q4_K_M
    shard_paths: "/mnt/dma-0/shard.gguf,/mnt/dma-1/shard.gguf,/mnt/dma-2/shard.gguf,/mnt/dma-3/shard.gguf"

- name: run_mmap
  uses: run_baseline
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    gguf_path: /mnt/gguf-shards/Llama-3.3-70B-Q4_K_M-00001-of-00004.gguf
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    iterations: 1
    loader: mmap

- name: run_stream
  uses: run_baseline
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    gguf_path: /mnt/gguf-shards/Llama-3.3-70B-Q4_K_M-00001-of-00004.gguf
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    iterations: 1
    loader: stream

- name: run_xnvme_file
  uses: run_baseline
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    gguf_path: /mnt/gguf-shards/Llama-3.3-70B-Q4_K_M-00001-of-00004.gguf
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    iterations: 1
    loader: xnvme
    xnvme_be: io_uring_file
    direct_io: "true"
    xnvme_cpu: "0"

- name: detach_c1
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:c1:00.0"
    fs_mount_point: /mnt/dma-0

- name: detach_c2
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:c2:00.0"
    fs_mount_point: /mnt/dma-1

- name: detach_c3
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:c3:00.0"
    fs_mount_point: /mnt/dma-2

- name: detach_c4
  uses: detach_dma_target
  with:
    dma_pci_addr: "0000:c4:00.0"
    fs_mount_point: /mnt/dma-3

- name: upcie_prime
  uses: upcie_prime
  with:
    pci_addrs: "0000:c1:00.0,0000:c2:00.0,0000:c3:00.0,0000:c4:00.0"
    runtime: 2

- name: run_upcie_cuda
  uses: run_baseline
  with:
    llama_bin: /root/llama.cpp/build/bin/llama-completion
    gguf_path: /mnt/gguf-src/Llama-3.3-70B-Q4_K_M-00001-of-00004.gguf
    n_gpu_layers: 999
    prompt: "hi"
    n_tokens: 1
    iterations: 1
    loader: xnvme
    xnvme_be: upcie-cuda
    xnvme_cpu: "0"
    xnvme_dma_uris: "0000:c1:00.0,0000:c2:00.0,0000:c3:00.0,0000:c4:00.0"
    xnvme_dma_extents: "/root/dma-c1.extents.json,/root/dma-c2.extents.json,/root/dma-c3.extents.json,/root/dma-c4.extents.json"
